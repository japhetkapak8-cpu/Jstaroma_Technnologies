<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Admin Login | JStaroma Technologies
  </title>

  <link
    rel="stylesheet"
    href="css/admin.css"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

</head>


<body class="login-page">


  <div class="login-wrapper">


    <div class="login-brand">

      <div class="brand-mark">
        JT
      </div>


      <h1>
        JSTAROMA<span>TECH</span>
      </h1>


      <p>
        Administration Portal
      </p>

    </div>



    <div class="login-card">

      <div class="login-icon">

        <i class="fa-solid fa-lock"></i>

      </div>


      <h2>
        Admin Login
      </h2>


      <p class="login-description">

        Sign in to manage your JStaroma
        Technologies website.

      </p>


      <form id="loginForm">


        <div class="form-group">

          <label for="email">
            Email
          </label>

          <input
            type="email"
            id="email"
            required
            autocomplete="email"
          >

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            required
            autocomplete="current-password"
          >

        </div>


        <button
          type="submit"
          id="loginBtn"
          class="primary-btn full-btn"
        >

          <i class="fa-solid fa-right-to-bracket"></i>

          Sign In

        </button>


        <p
          id="loginMessage"
          class="form-message"
        ></p>


      </form>


      <a
        href="../index.html"
        class="back-link"
      >

        ← Back to JStaroma Technologies

      </a>

    </div>

  </div>


  <script
    type="module"
    src="js/login.js"
  ></script>


</body>

</html>
